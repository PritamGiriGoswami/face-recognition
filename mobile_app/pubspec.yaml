version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  camera: ^0.10.5+9
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  image: ^4.1.3
  google_fonts: ^6.1.0
  geolocator: ^11.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0
  sqflite: ^2.3.2
