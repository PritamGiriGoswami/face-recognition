<style>
        @keyframes scan {
            0% { transform: translateY(-100%); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(100%); opacity: 0; }
        }
        .scan-line {
            animation: scan 2s linear infinite;
            background: linear-gradient(to bottom, transparent, #2fd9f4, transparent);
        }
        .glow-pulse {
            animation: pulse-glow 2s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(208,188,255,0.1); }
            50% { box-shadow: 0 0 40px rgba(208,188,255,0.3); }
        }
        .corner-bracket {
            position: absolute;
            width: 32px;
            height: 32px;
            border-color: #2fd9f4;
            border-width: 0;
        }
        .top-left { top: -2px; left: -2px; border-top-width: 3px; border-left-width: 3px; border-top-left-radius: 12px; }
        .top-right { top: -2px; right: -2px; border-top-width: 3px; border-right-width: 3px; border-top-right-radius: 12px; }
        .bottom-left { bottom: -2px; left: -2px; border-bottom-width: 3px; border-left-width: 3px; border-bottom-left-radius: 12px; }
        .bottom-right { bottom: -2px; right: -2px; border-bottom-width: 3px; border-right-width: 3px; border-bottom-right-radius: 12px; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-surface text-on-surface font-body-md selection:bg-primary/30 min-h-screen overflow-hidden flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface/80 dark:bg-surface/80 backdrop-blur-xl border-b border-white/5 shadow-sm flex justify-between items-center px-margin-mobile h-16 w-full fixed top-0 z-50">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container overflow-hidden">
<span class="material-symbols-outlined" data-icon="school">school</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">EduGuard AI</h1>
</div>
<button class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Content: AI Scanning Interface -->
<main class="flex-grow flex flex-col items-center justify-center pt-16 px-6">
<div class="relative w-full max-w-md aspect-square flex items-center justify-center">
<!-- HUD Brackets Container -->
<div class="relative w-72 h-72 md:w-80 md:h-80 rounded-full">
<!-- Outer Glow Container -->
<div class="absolute inset-0 rounded-full glow-pulse border border-primary/20"></div>
<!-- Camera Preview Mockup -->
<div class="absolute inset-2 rounded-full overflow-hidden bg-surface-container-highest border-2 border-white/5">
<img alt="Camera Preview" class="w-full h-full object-cover opacity-60 grayscale" data-alt="A focused high-definition close-up of a student's face against a blurred modern school background. The image has a cinematic dark blue and obsidian tint to match a futuristic UI theme. Dramatic overhead lighting creates sharp highlights on the subject's features. The overall atmosphere is high-tech, secure, and professional, utilizing a deep-space obsidian and violet color palette." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB38PoUAbOSF3dS46CnLGDZOXsfooyCeISDIF0d4CEhh0COhHxAWYU4oZSvNlSPKMfnbMRYVq4_1Nx_1XfCZsE90btepK0sYXk6Oghcqhvp9NuIHu4AAVBVXuvYmWcN9VrcdUNKeHuOAQfSUMF3y1YDpQrgwDOJ_ZXnP4MZxhnp9hdok1pzJ6_11rBoDQP-1O-cHojsRL1DoyRlS3Ut5-RI6t6sKAhq7s9ciViRw-9QIlixDbmmJApnWRKQU5ToKI632voJxX7SiP6n"/>
<!-- Scanning Line Animation -->
<div class="scan-line absolute top-0 left-0 w-full h-1/2 z-10 pointer-events-none opacity-50"></div>
<!-- HUD Overlays -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="w-48 h-48 border border-tertiary/20 rounded-lg flex items-center justify-center">
<div class="w-4 h-4 border-t border-l border-tertiary"></div>
<div class="absolute inset-x-0 top-1/2 h-[1px] bg-tertiary/10"></div>
<div class="absolute inset-y-0 left-1/2 w-[1px] bg-tertiary/10"></div>
</div>
</div>
</div>
<!-- L-Shaped Tech Brackets -->
<div class="corner-bracket top-left"></div>
<div class="corner-bracket top-right"></div>
<div class="corner-bracket bottom-left"></div>
<div class="corner-bracket bottom-right"></div>
</div>
</div>
<!-- Status & Text -->
<div class="mt-stack-lg text-center space-y-4">
<div class="flex items-center justify-center gap-2 text-tertiary">
<span class="material-symbols-outlined animate-pulse" data-icon="bolt">bolt</span>
<p class="font-headline-lg-mobile text-headline-lg-mobile font-semibold tracking-wide">Scanning...</p>
</div>
<p class="text-on-surface-variant font-body-md">Please look into the camera and keep steady</p>
<div class="flex flex-col items-center gap-6 mt-8">
<!-- AI Verified Pill (Hidden/Revealed interaction simulation) -->
<div class="inline-flex items-center gap-2 bg-surface-container-high border border-white/10 px-4 py-2 rounded-full shadow-lg transition-all duration-500 opacity-0 transform translate-y-4" id="status-pill">
<span class="material-symbols-outlined text-tertiary text-sm" data-icon="auto_awesome">auto_awesome</span>
<span class="text-sm font-medium">AI Identity Engine Online</span>
</div>
<!-- Cancel Button -->
<button class="group flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors px-6 py-3 border border-outline-variant/30 rounded-xl bg-surface-container-low hover:bg-surface-variant/50 active:scale-95 transition-all" onclick="window.history.back()">
<span class="material-symbols-outlined text-lg" data-icon="close">close</span>
<span class="font-label-sm uppercase tracking-widest">Cancel Scan</span>
</button>
</div>
</div>
</main>
<!-- Bottom Notification Toast (Simulated Interaction) -->
<div class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[90%] max-w-sm bg-surface-container-highest/95 backdrop-blur-xl p-4 rounded-2xl border-l-4 border-tertiary shadow-2xl transform translate-y-32 transition-transform duration-700 ease-out z-50" id="completion-toast">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-tertiary/20 flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div>
<p class="text-sm font-bold text-on-surface">Attendance Marked</p>
<p class="text-xs text-on-surface-variant">Profile: Liam Nelson • 08:42 AM</p>
</div>
</div>
</div>
<!-- Interactive Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Reveal Status Pill
            setTimeout(() => {
                const pill = document.getElementById('status-pill');
                pill.classList.remove('opacity-0', 'translate-y-4');
                pill.classList.add('opacity-100', 'translate-y-0');
            }, 1000);

            // Simulate Success Toast after 3 seconds
            setTimeout(() => {
                const toast = document.getElementById('completion-toast');
                toast.classList.remove('translate-y-32');
                toast.classList.add('translate-y-0');
                
                // Audio signal (visual only here)
                const brackets = document.querySelectorAll('.corner-bracket');
                brackets.forEach(b => b.style.borderColor = '#d0bcff');
            }, 3500);
        });
    </script>
